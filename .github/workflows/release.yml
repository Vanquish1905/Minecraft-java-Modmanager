name: Build and release

# A push to main publishes a release for the version in vanquish/__init__.py
# (only if that version has no release yet). Bump __version__ in vanquish/__init__.py to release again.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v2.0.0"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"
          else TAG="v$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("vanquish/__init__.py").read()).group(1))')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release $TAG already exists - nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Will release $TAG"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            artifact: dist/VanquishModManager.exe
          - os: ubuntu-22.04   # older glibc = runs on more Linux distros
            artifact: dist/*-linux-portable.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Tk
        run: python -c "import tkinter; print(tkinter.TkVersion)"
      - name: Unit tests
        run: python -m unittest tests.test_core -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build
        run: python build.py --portable-zip
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ls -la artifacts
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Vanquish's Mod Manager ${TAG#v}" \
            --notes-file .github/RELEASE_NOTES.md \
            --latest
