name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v2.0.0"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            artifact: dist/VanquishModManager.exe
          - os: ubuntu-22.04   # older glibc = runs on more Linux distros
            artifact: dist/*-linux-portable.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Tk
        run: python -c "import tkinter; print(tkinter.TkVersion)"
      - name: Unit tests
        run: python -m unittest tests.test_core -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build
        run: python build.py --portable-zip
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          ls -la artifacts
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Vanquish's Mod Manager ${TAG#v}" \
            --notes-file .github/RELEASE_NOTES.md \
            --latest
